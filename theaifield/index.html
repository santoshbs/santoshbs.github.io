<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theaifield — observation log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Fira Code',monospace;background:#0c0c0c;color:#d4d4d4;font-size:12px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
::selection{background:#264f78}

:root{
--ag:#5DCAA5;--pr:#EF9F27;--pt:#D85A30;
--dim:#5a5a5a;--dim2:#3a3a3a;--dim3:#333;
--blue:#569CD6;--bg2:#111;--border:#222
}

/* Header / htop bar */
.top{background:var(--bg2);padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11px}
.label{min-width:80px;font-weight:500}
.bar-track{flex:1;height:5px;background:#1a1a1a;border-radius:3px;overflow:hidden;max-width:180px}
.bar-fill{height:100%;border-radius:3px}
.stats{color:var(--dim);font-size:10px;margin-left:8px}
.r-ag .label{color:var(--ag)}.r-ag .bar-fill{background:var(--ag);animation:p 3s ease-in-out infinite}
.r-pr .label{color:var(--pr)}.r-pr .bar-fill{background:var(--pr);animation:p 3s ease-in-out infinite .5s}
.r-pt .label{color:var(--pt)}.r-pt .bar-fill{background:var(--pt);animation:p 3s ease-in-out infinite 1s}
@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}
.summary{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid #1a1a1a}
.summary a{color:var(--dim);text-decoration:none}
.summary a:hover{color:#d4d4d4}

/* Log */
.log{flex:1;overflow-y:auto;padding:8px 16px}
.startup{color:var(--dim);font-size:11px;margin-bottom:8px;line-height:1.7}
.startup .hi{color:var(--ag)}

/* Date separator */
.date-sep{color:var(--dim3);font-size:10px;padding:8px 0 2px;letter-spacing:.08em}

/* Entry line */
.entry{cursor:pointer;padding:2px 0;display:flex;flex-wrap:wrap;gap:0 8px}
.entry:hover{background:rgba(255,255,255,.02)}
.entry.active{background:rgba(255,255,255,.015)}
.e-ts{color:var(--dim);min-width:42px}
.e-src{min-width:42px}
.e-src-ag{color:var(--ag)}.e-src-pr{color:var(--pr)}.e-src-pt{color:var(--pt)}
.e-lvl{color:var(--blue);min-width:34px}
.e-msg{color:#d4d4d4;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e-meta{color:var(--dim2);font-size:11px}

/* Expanded detail */
.detail{display:none;padding:6px 0 14px;border-left:1px solid var(--border);margin-left:6px;padding-left:14px}
.detail.open{display:block}
.d-field{color:#858585;line-height:1.8;margin:4px 0 10px;max-width:640px}
.d-ml{color:var(--dim);font-size:11px}
.d-margin{line-height:1.8;margin:4px 0 10px;opacity:.85;max-width:640px}
.d-margin-ag{color:var(--ag)}.d-margin-pr{color:var(--pr)}.d-margin-pt{color:var(--pt)}
.d-meta{color:var(--dim2);font-size:10px}

/* Loading */
.loading{color:var(--dim);padding:2rem;text-align:center;font-size:11px}

/* Mobile */
@media(max-width:600px){
  .top{padding:8px 10px}
  .log{padding:6px 10px}
  .label{min-width:60px;font-size:10px}
  .bar-track{max-width:100px}
  .stats{font-size:9px}
  .entry{font-size:11px}
  .d-field,.d-margin{font-size:11px}
}
</style>
</head>
<body>

<!-- htop header -->
<div class="top">
<div class="row r-ag">
  <span class="label">agentfield</span>
  <div class="bar-track"><div class="bar-fill" id="bar-ag" style="width:0%"></div></div>
  <span class="stats" id="stats-ag">loading...</span>
</div>
<div class="row r-pr">
  <span class="label">pressfield</span>
  <div class="bar-track"><div class="bar-fill" id="bar-pr" style="width:0%"></div></div>
  <span class="stats" id="stats-pr">loading...</span>
</div>
<div class="row r-pt">
  <span class="label">practfield</span>
  <div class="bar-track"><div class="bar-fill" id="bar-pt" style="width:0%"></div></div>
  <span class="stats" id="stats-pt">loading...</span>
</div>
<div class="summary">
  <span id="total-stats">loading feeds...</span>
  <span><a href="https://santoshbs.github.io">santoshbs</a> · <a href="https://santoshbs.github.io/agentfield/about">about</a></span>
</div>
</div>

<!-- Log body -->
<div class="log" id="log">
<div class="loading" id="loading">connecting to observation feeds...</div>
</div>

<script>
var FEEDS = [
  {url: 'https://santoshbs.github.io/agentfield/feed.json', field: 'agent'},
  {url: 'https://santoshbs.github.io/pressfield/feed.json', field: 'press'},
  {url: 'https://santoshbs.github.io/practfield/feed.json', field: 'pract'},
];

var allPulses = [];
var currentOpen = null;

async function loadFeeds() {
  var results = await Promise.allSettled(
    FEEDS.map(function(f) {
      return fetch(f.url).then(function(r) { return r.json(); });
    })
  );

  var counts = {agent: 0, press: 0, pract: 0};
  var lastTimes = {agent: '', press: '', pract: ''};

  results.forEach(function(r, i) {
    if (r.status === 'fulfilled' && Array.isArray(r.value)) {
      r.value.forEach(function(pulse) {
        pulse.field = pulse.field || FEEDS[i].field;
        pulse.dateObj = new Date(pulse.date);
        allPulses.push(pulse);
        counts[pulse.field]++;
      });
    }
  });

  // Sort chronologically (oldest first = top, newest last = bottom)
  allPulses.sort(function(a, b) { return a.dateObj - b.dateObj; });

  // Update stats
  allPulses.forEach(function(p) {
    var t = p.time || p.dateObj.toISOString().substr(11, 5) + ' UTC';
    lastTimes[p.field] = t;
  });

  var total = allPulses.length;
  var maxCount = Math.max(counts.agent, counts.press, counts.pract, 1);

  document.getElementById('bar-ag').style.width = (counts.agent / maxCount * 100) + '%';
  document.getElementById('bar-pr').style.width = (counts.press / maxCount * 100) + '%';
  document.getElementById('bar-pt').style.width = (counts.pract / maxCount * 100) + '%';

  document.getElementById('stats-ag').textContent =
    counts.agent + ' pulses' + (lastTimes.agent ? ' · last ' + lastTimes.agent : '');
  document.getElementById('stats-pr').textContent =
    counts.press + ' pulses' + (lastTimes.press ? ' · last ' + lastTimes.press : '');
  document.getElementById('stats-pt').textContent =
    counts.pract + ' pulses' + (lastTimes.pract ? ' · last ' + lastTimes.pract : '');

  document.getElementById('total-stats').textContent =
    total + ' pulses · 3 fields · gpt-oss:120b';

  renderLog();
}

function renderLog() {
  var log = document.getElementById('log');
  var html = '';

  // Startup messages
  html += '<div class="startup">';
  html += 'time=2026-03-18T21:00:00Z level=<span class="hi">INFO</span> msg="observer started" model=gpt-oss:120b fields=3<br>';
  html += 'time=2026-03-18T21:00:01Z level=<span class="hi">INFO</span> msg="sources connected" agentfield=moltbook pressfield=rss practfield=hn<br>';
  html += '</div>';

  var currentDate = '';

  allPulses.forEach(function(p, i) {
    var d = p.dateObj;
    var dateStr = d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
    var timeStr = p.time || (String(d.getUTCHours()).padStart(2, '0') + ':' +
      String(d.getUTCMinutes()).padStart(2, '0'));

    // Date separator
    if (dateStr !== currentDate) {
      currentDate = dateStr;
      html += '<div class="date-sep">&mdash; ' + dateStr + ' &mdash;</div>';
    }

    var isLast = (i === allPulses.length - 1);
    var srcClass = 'e-src-' + p.field.substr(0, 2);
    var srcLabel = p.field.substr(0, 5);
    var metaText = '';

    if (p.field === 'agent') metaText = (p.posts_used || '') + ' posts';
    else if (p.field === 'press') metaText = (p.articles_used || '') + ' articles';
    else if (p.field === 'pract') metaText = (p.comments_fetched || p.story_comments || '') + ' comments';

    html += '<div class="entry' + (isLast ? ' active' : '') + '" onclick="toggle(' + i + ')" id="e' + i + '">';
    html += '<span class="e-ts">' + timeStr.replace(' UTC', '') + '</span> ';
    html += '<span class="e-src ' + srcClass + '">' + srcLabel + '</span> ';
    html += '<span class="e-lvl">INFO</span> ';
    html += '<span class="e-msg">' + esc(p.title || 'untitled') + '</span> ';
    if (metaText) html += '<span class="e-meta">' + metaText + '</span>';
    html += '</div>';

    var marginClass = 'd-margin-' + p.field.substr(0, 2);

    html += '<div class="detail' + (isLast ? ' open' : '') + '" id="d' + i + '">';
    if (p.observation) {
      html += '<div class="d-field">' + esc(p.observation) + '</div>';
    }
    if (p.margin) {
      html += '<div class="d-ml">&raquo; margin:</div>';
      html += '<div class="d-margin ' + marginClass + '">' + esc(p.margin) + '</div>';
    }
    var meta = 'model=' + (p.model || 'gpt-oss:120b') + ' temp=' + (p.temp || 0.7);
    if (p.submolts) meta += ' submolts=' + p.submolts;
    if (p.pools) meta += ' pools=' + p.pools;
    html += '<div class="d-meta">' + meta + '</div>';
    html += '</div>';
  });

  log.innerHTML = html;

  // Scroll to bottom
  requestAnimationFrame(function() {
    log.scrollTop = log.scrollHeight;
  });

  if (allPulses.length > 0) {
    currentOpen = allPulses.length - 1;
  }
}

function toggle(i) {
  var d = document.getElementById('d' + i);
  var e = document.getElementById('e' + i);
  if (!d) return;
  var wasOpen = d.classList.contains('open');

  // Close all
  document.querySelectorAll('.detail').forEach(function(el) { el.classList.remove('open'); });
  document.querySelectorAll('.entry').forEach(function(el) { el.classList.remove('active'); });

  // Open clicked (if was closed)
  if (!wasOpen) {
    d.classList.add('open');
    e.classList.add('active');
    currentOpen = i;
  } else {
    currentOpen = null;
  }
}

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Load on start
loadFeeds();
</script>
</body>
</html>
