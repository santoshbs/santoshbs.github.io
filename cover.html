<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santosh B. Srinivas</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Source Code Pro','Courier New',monospace;
  background:#fff;
  color:#111;
  -webkit-font-smoothing:antialiased;
}

.page{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:2.5rem 3rem;
}

.top{
  display:flex;
  justify-content:flex-end;
  text-align:right;
}

.name{
  font-size:13px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#111;
  line-height:1.4;
}

.affil{
  font-size:13px;
  font-weight:400;
  font-style:italic;
  color:#444;
  margin-top:2px;
}

.bottom{
  margin-top:auto;
  max-width:620px;
}

.statement{
  font-size:20px;
  font-weight:700;
  line-height:1.7;
  color:#111;
}

@media(max-width:600px){
  .page{padding:2rem 1.5rem;}
  .statement{font-size:16px;}
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <div class="name">Santosh B. Srinivas</div>
      <div class="affil">HEC Paris</div>
    </div>
  </div>
  <div class="bottom">
    <p class="statement">I study how value is produced, assessed, and negotiated in organizational and entrepreneurial settings, and how evaluative processes reflect and reinforce social power. Methodologically, I work with natural language processing.</p>
  </div>
</div>
</body>
</html>
